name: Refresh contribution graph

on:
  schedule:
    - cron: "0 5 * * *"  # Every day at 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements-daily.txt

      - name: Fetch and Render Graph
        run: |
          python tools/pull_contributions.py ${{ github.repository_owner }}
          python tools/render_graph.py

      - name: Commit updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph [skip ci]"
          file_pattern: "assets/contributions.json graph.svg"
