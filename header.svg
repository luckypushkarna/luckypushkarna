<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
    <defs>
        <clipPath id="title-clip">
            <rect x="150" y="70" width="0" height="60">
                <animate attributeName="width" from="0" to="700" begin="0.2s" dur="1.2s" fill="freeze" calcMode="linear" />
            </rect>
        </clipPath>
        <clipPath id="subtitle-clip">
            <rect x="150" y="130" width="0" height="50">
                <animate attributeName="width" from="0" to="700" begin="1.5s" dur="1.5s" fill="freeze" calcMode="linear" />
            </rect>
        </clipPath>
    </defs>
    <style>
        .title {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, Helvetica, Arial, sans-serif;
            font-size: 38px;
            font-weight: 600;
            fill: #ffffff;
            letter-spacing: 1.5px;
        }
        .subtitle {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            font-weight: 300;
            fill: #d0d7ff;
            letter-spacing: 0.8px;
        }
        .glass-box {
            fill: rgba(15, 15, 35, 0.45);
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 1px;
        }
        .caret {
            fill: #ffffff;
            opacity: 0;
        }
        .caret-title {
            animation: blink 0.8s step-end infinite, showCaret 0.1s 1.4s forwards, hideCaret 0.1s 1.5s forwards;
        }
        .caret-sub {
            animation: blink 0.8s step-end infinite, showCaret 0.1s 1.5s forwards;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        @keyframes showCaret {
            to { opacity: 1; }
        }
        @keyframes hideCaret {
            to { opacity: 0; }
        }
    </style>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#2b26c3"/>

    <!-- Glass Container -->
    <rect x="150" y="70" width="700" height="110" rx="14" ry="14" class="glass-box" />

    <!-- Title with typewriter reveal -->
    <g clip-path="url(#title-clip)">
        <text x="500" y="115" dominant-baseline="middle" text-anchor="middle" class="title">Lucky Pushkarna</text>
    </g>

    <!-- Subtitle with typewriter reveal -->
    <g clip-path="url(#subtitle-clip)">
        <text x="500" y="152" dominant-baseline="middle" text-anchor="middle" class="subtitle">Full-Stack Python Developer & AI-Assisted Engineer</text>
    </g>
</svg>