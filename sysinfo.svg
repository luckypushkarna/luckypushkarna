<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 6px; }
        .header-title { font-family: monospace; font-size: 12px; fill: #8b949e; font-weight: bold; }
        .label { font-family: monospace; font-size: 13px; fill: #ff79c6; font-weight: bold; }
        .val { font-family: monospace; font-size: 13px; fill: #f8f8f2; }
        @keyframes fadeInLine {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
            .line-0 {
                animation: fadeInLine 0.4s ease-out 0.20s forwards;
                opacity: 0;
            }
            .line-1 {
                animation: fadeInLine 0.4s ease-out 0.50s forwards;
                opacity: 0;
            }
            .line-2 {
                animation: fadeInLine 0.4s ease-out 0.80s forwards;
                opacity: 0;
            }
            .line-3 {
                animation: fadeInLine 0.4s ease-out 1.10s forwards;
                opacity: 0;
            }
            .line-4 {
                animation: fadeInLine 0.4s ease-out 1.40s forwards;
                opacity: 0;
            }
    </style>
    <rect width="100%" height="100%" class="bg"/>
    
    <!-- Window Header Controls -->
    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="35" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="50" cy="20" r="5" fill="#27c93f"/>
    <text x="70" y="24" class="header-title">system_info.sh</text>
    <line x1="0" y1="35" x2="460" y2="35" stroke="#30363d" stroke-width="1"/>
    
    
        <g class="line-0">
            <text x="25" y="58" class="label">role:</text>
            <text x="95" y="58" class="val">Full-Stack Engineer</text>
        </g>
        <g class="line-1">
            <text x="25" y="86" class="label">focus:</text>
            <text x="95" y="86" class="val">Distributed Systems & Automation</text>
        </g>
        <g class="line-2">
            <text x="25" y="114" class="label">stack:</text>
            <text x="95" y="114" class="val">Python · Go · React · PostgreSQL</text>
        </g>
        <g class="line-3">
            <text x="25" y="142" class="label">now:</text>
            <text x="95" y="142" class="val">Building self-animating terminal profile READMEs</text>
        </g>
        <g class="line-4">
            <text x="25" y="170" class="label">status:</text>
            <text x="95" y="170" class="val">Available for select freelance & roles</text>
        </g>
</svg>